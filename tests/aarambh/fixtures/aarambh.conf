# Test copy of the menu config that modules/core/aarambh.nix generates for the
# desktop. Only the default entry changes between runs (@DEFAULT@), the rest
# matches the module output. The PARTUUIDs match the test images in run.sh.
theme editorial-gruvbox
timeout 5
default @DEFAULT@
autodetect yes
edit yes

font_light fonts/light.ttf
font_regular fonts/regular.ttf
font_bold fonts/bold.ttf
font_mono fonts/mono.ttf

volume work partuuid=4a512320-ad94-44b6-883f-ba9c8a3335c2

entry NixOS | \EFI\systemd\systemd-bootx64.efi | logos/nixos.png | backgrounds/nixos.jpg | nixos
entry NixOS (work) | @work:\EFI\SYSTEMD\SYSTEMD-BOOTX64.EFI | logos/nixos.png | backgrounds/nixos.jpg | nixos-work
entry Windows | @work:\EFI\MICROSOFT\BOOT\BOOTMGFW.EFI | logos/windows.png | backgrounds/windows.jpg | windows
entry Firmware | @firmware | logos/settings.png | backgrounds/settings.jpg |  
entry Restart | @reboot | logos/restart.png | backgrounds/restart.jpg |  
entry Power Off | @shutdown | logos/power.png | backgrounds/power.jpg |  
