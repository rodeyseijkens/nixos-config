# cava config for the mystaryo.media bar widget.
# parecord->fifo bridge (cava 0.10.x pulse/pipewire inputs attach but read
# zeros on this system; parecord demonstrably captures full-scale).
# The widget creates a private per-user runtime fifo and substitutes its path
# when starting cava; only the recorder process it started is cleaned up.
[general]
framerate = 30
bars_number = 12
autosens = 1
sensitivity = 240
[input]
method = fifo
source = __MYSTARYO_CAVA_FIFO__
sample_rate = 48000
sample_bits = 16
channels = 2
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
[smoothing]
noise_reduction = 12
